# Guacamole configuration
guacd-hostname: 127.0.0.1
guacd-port: 4822

# NoAuth extension - no login required
# Extension provides all connections from noauth-config.xml
auth-provider: net.sourceforge.guac.noauth.NoAuthenticationProvider

# Recording storage extension configuration
# Search path for recordings (overridden by RECORDING_SEARCH_PATH env var if set)
recording-search-path: /recordings

# Logging
log-level: info

# Session timeout (in minutes)
api-session-timeout: 60
