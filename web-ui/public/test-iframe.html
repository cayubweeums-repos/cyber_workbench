<!DOCTYPE html>
<html>
<head>
    <title>Test iframe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        .viewer-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #novnc-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="viewer-content">
        <iframe id="novnc-viewer" src="http://localhost:3000/novnc/vnc.html?host=localhost&port=3000&path=websockify/test_full_novnc&autoconnect=true"></iframe>
    </div>
    <script>
        const iframe = document.getElementById('novnc-viewer');
        iframe.onload = () => {
            console.log('Iframe loaded');
            const rect = iframe.getBoundingClientRect();
            console.log('Iframe dimensions:', rect.width, 'x', rect.height);
        };
    </script>
</body>
</html>
