<!DOCTYPE html>
<html>
<head>
    <title>VM Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        
        .viewer-header {
            background-color: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
        }
        
        .viewer-title {
            color: #dafc7b;
            font-size: 18px;
            font-weight: bold;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background-color: #444;
            color: #fff;
        }
        
        .btn:hover {
            background-color: #555;
        }
        
        .viewer-content {
            position: relative;
            width: 100vw;
            height: calc(100vh - 60px); /* Full viewport minus header */
            margin-top: 60px; /* Start below header */
            overflow: hidden;
        }
        
        #novnc-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="viewer-header">
        <div class="viewer-title" id="viewer-title">VM Viewer</div>
        <button class="btn" onclick="window.location.href='/'">Close</button>
    </div>
    
    <div class="viewer-content">
        <iframe id="novnc-viewer"></iframe>
    </div>
    
    <script>
        // Get VM name from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const vmName = urlParams.get('vm') || urlParams.get('name');
        
        if (!vmName) {
            document.body.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #f00; text-align: center; flex-direction: column;">
                    <p><strong>Error: No VM name specified</strong></p>
                    <p style="font-size: 14px; color: #888;">Usage: viewer.html?vm=VM_NAME</p>
                </div>
            `;
        } else {
            // Update title
            document.getElementById('viewer-title').textContent = `VM Viewer - ${vmName}`;
            
            // Build noVNC URL - exact same format as test-iframe.html
            const expressPort = 3000;
            const websockifyPath = `websockify/${vmName}`;
            const novncUrl = `http://localhost:${expressPort}/novnc/vnc.html?host=localhost&port=${expressPort}&path=${websockifyPath}&autoconnect=true`;
            
            // Set iframe src - exact same as test-iframe.html
            const iframe = document.getElementById('novnc-viewer');
            iframe.src = novncUrl;
            
            // Log on load - exact same as test-iframe.html
            iframe.onload = () => {
                console.log('Iframe loaded');
                const rect = iframe.getBoundingClientRect();
                console.log('Iframe dimensions:', rect.width, 'x', rect.height);
            };
        }
    </script>
</body>
</html>
