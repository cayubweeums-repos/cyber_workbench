<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Navigation Sidebar -->
        <div id="nav-sidebar-container"></div>
        
        <div class="main-content">
            <div class="container">
                <!-- Environments View -->
                <div id="environments-view" class="view-section">
                    <div class="header">
                        <h1>Environments</h1>
                        <div class="header-actions">
                            <a href="/docs" class="btn btn-secondary" target="_blank" id="docs-link">Docs</a>
                            <label class="advanced-toggle">
                                <input type="checkbox" id="advanced-mode-toggle">
                                <span>Advanced Mode</span>
                            </label>
                            <button class="btn" id="create-environment-btn">Create Environment</button>
                        </div>
                    </div>
                    <div id="environment-list-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading environments...</p>
                        </div>
                    </div>
                </div>

                <!-- VMs View -->
                <div id="vms-view" class="view-section" style="display: none;">
                    <div class="header">
                        <h1>VM Manager</h1>
                        <div class="header-actions">
                            <a href="/docs" class="btn btn-secondary" target="_blank" id="docs-link-vms">Docs</a>
                            <label class="advanced-toggle">
                                <input type="checkbox" id="advanced-mode-toggle-vms">
                                <span>Advanced Mode</span>
                            </label>
                            <button class="btn" id="create-vm-btn">Create VM</button>
                        </div>
                    </div>
                    <div id="vm-list-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading VMs...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create VM Dialog -->
    <div class="dialog-overlay" id="create-dialog">
        <div class="dialog-content">
            <h2>Create New VM</h2>
            
            <div class="form-group">
                <label for="vm-name">VM Name</label>
                <input type="text" id="vm-name" placeholder="Enter VM name" value="">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="vm-cpu">CPU Cores</label>
                    <div class="slider-group">
                        <input type="range" id="vm-cpu" min="1" max="16" value="8">
                        <span class="value" id="cpu-value">8 cores</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vm-ram">RAM (GB)</label>
                    <div class="slider-group">
                        <input type="range" id="vm-ram" min="2" max="32" value="8">
                        <span class="value" id="ram-value">8 GB</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="vm-disk">Disk Size (GB)</label>
                <input type="number" id="vm-disk" min="20" value="64">
            </div>

            <div id="create-progress" style="display: none;">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progress-text">Initializing...</div>
                </div>
            </div>

            <div id="create-error" class="error-message" style="display: none;"></div>

            <div class="dialog-actions">
                <button class="btn btn-secondary" data-action="cancel">Cancel</button>
                <button class="btn" data-action="confirm">Create</button>
            </div>
        </div>
    </div>

    <!-- Create Environment Wizard -->
    <div class="dialog-overlay" id="environment-wizard">
        <div class="dialog-content wizard-dialog">
            <h2>Create Environment</h2>
            <div class="wizard-progress">Step 1 of 4</div>
            <div class="wizard-content"></div>
            <div class="dialog-actions">
                <button class="btn btn-secondary" data-action="cancel">Cancel</button>
                <button class="btn btn-secondary" data-action="back" style="display: none;">Back</button>
                <button class="btn" data-action="next">Next</button>
                <button class="btn" data-action="confirm" style="display: none;">Create</button>
            </div>
        </div>
    </div>

    <!-- Edit VM Dialog -->
    <div class="dialog-overlay" id="edit-dialog">
        <div class="dialog-content">
            <h2>Edit VM</h2>
            
            <div class="form-group">
                <label for="edit-vm-name">VM Name</label>
                <input type="text" id="edit-vm-name" placeholder="Enter VM name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="edit-vm-cpu">CPU Cores</label>
                    <div class="slider-group">
                        <input type="range" id="edit-vm-cpu" min="1" max="16" value="8">
                        <span class="value" id="edit-cpu-value">8 cores</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="edit-vm-ram">RAM (GB)</label>
                    <div class="slider-group">
                        <input type="range" id="edit-vm-ram" min="2" max="32" value="8">
                        <span class="value" id="edit-ram-value">8 GB</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="edit-vm-disk">Disk Size (GB)</label>
                <input type="number" id="edit-vm-disk" min="20" disabled>
                <small style="color: var(--color-text-secondary);">Disk size cannot be changed</small>
            </div>

            <div id="edit-error" class="error-message" style="display: none;"></div>

            <div class="dialog-actions">
                <button class="btn btn-secondary" data-action="cancel">Cancel</button>
                <button class="btn" data-action="confirm">Save</button>
            </div>
        </div>
    </div>

    <!-- Environment Viewer -->
    <div class="viewer-container" id="environment-viewer-container" style="display: none;">
        <!-- Content will be rendered by EnvironmentViewer component -->
    </div>

    <!-- VM Viewer -->
    <div class="viewer-container" id="viewer-container">
        <div class="viewer-header">
            <div class="viewer-title" id="viewer-title">VM Viewer</div>
            <div class="viewer-actions">
                <button class="btn btn-secondary btn-small" id="close-viewer-btn">Close</button>
            </div>
        </div>
        <div class="viewer-content">
            <!-- Progress Display -->
            <div id="viewer-progress" class="viewer-progress" style="display: none;">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="viewer-progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-info">
                        <div class="progress-stage" id="viewer-progress-stage">Initializing...</div>
                        <div class="progress-message" id="viewer-progress-message"></div>
                        <div class="progress-details" id="viewer-progress-details"></div>
                    </div>
                </div>
            </div>
            <!-- VNC Viewer iframe (Express serves noVNC) - exact same setup as test-iframe.html -->
            <iframe id="novnc-viewer" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;"></iframe>
        </div>
    </div>

    <!-- noVNC is served by Express on port 3000 -->
    <!-- Express serves noVNC files and proxies WebSocket connections to websockify -->
    <!-- We use a standalone viewer.html page that loads noVNC in an iframe -->
    <!-- vis-network for environment visualization -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css">
    <!-- Core -->
    <script src="js/core/APIClient.js"></script>
    <script src="js/core/ServiceTypeRegistry.js"></script>
    <script src="js/core/ToolRegistry.js"></script>
    <!-- Models -->
    <script src="js/models/VM.js"></script>
    <script src="js/models/Environment.js"></script>
    <!-- Services -->
    <script src="js/services/VMService.js"></script>
    <script src="js/services/EnvironmentService.js"></script>
    <script src="js/services/ServiceRegistry.js"></script>
    <!-- Components -->
    <script src="js/components/BaseComponent.js"></script>
    <script src="js/components/NavigationSidebar.js"></script>
    <script src="js/components/VMCard.js"></script>
    <script src="js/components/VMList.js"></script>
    <script src="js/components/VMDialog.js"></script>
    <script src="js/components/EnvironmentCard.js"></script>
    <script src="js/components/EnvironmentList.js"></script>
    <script src="js/components/EnvironmentWizard.js"></script>
    <script src="js/components/EnvironmentViewer.js"></script>
    <!-- Viewer -->
    <script src="js/viewer.js"></script>
    <!-- Main App -->
    <script src="js/app.js"></script>
</body>
</html>
