# nginx configuration for noVNC viewer
# Serves noVNC files and proxies WebSocket connections to websockify
# Port 8006 matches vapiorc for consistency
# This is a standalone config file used with nginx -c option

events {
    worker_connections 1024;
}

http {
    # Map to detect WebSocket upgrade requests
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8006;
        server_name localhost;

        # Logs (relative to nginx -p directory)
        access_log logs/access.log;
        error_log logs/error.log;

        # Root directory for noVNC files
        # This path will be set dynamically by nginx-manager.js
        root NOVNC_PATH_PLACEHOLDER;
        index vnc.html;

        # WebSocket proxy routes for VMs (dynamically added)
        # Format: /websockify/{vmname} -> proxies to VM's websockify port
        # These are added dynamically by nginx-manager.js
        
        # Default location - serve static files or proxy to default websockify
        location / {
            # Check if this is a WebSocket upgrade request to root
            # This is for backward compatibility (single VM scenario)
            if ($http_upgrade) {
                # Try to proxy to a default websockify (first running VM)
                # This will be handled by the dynamic VM routes above
                # If no VM routes exist, this won't match and will serve static files
                break;
            }
            
            # Otherwise serve static files
            try_files $uri $uri/ /vnc.html;
            
            # Set proper MIME types
            types {
                text/html html;
                text/css css;
                application/javascript js;
                application/json json;
                image/png png;
                image/svg+xml svg;
                image/x-icon ico;
            }
            
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        }
    }
}
