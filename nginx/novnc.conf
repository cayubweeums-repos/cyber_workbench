# nginx configuration for noVNC viewer
# Serves noVNC files and proxies WebSocket connections to websockify
# Port 8006 matches vapiorc for consistency

# Map to detect WebSocket upgrade requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8006;
    server_name localhost;

    # Logs
    access_log logs/access.log;
    error_log logs/error.log;

    # Root directory for noVNC files
    # This path will be set dynamically by nginx-manager.js
    root NOVNC_PATH_PLACEHOLDER;
    index vnc.html;

    # WebSocket proxy - proxy WebSocket connections to websockify on port 6080
    # noVNC connects to ws://localhost:8006/ which nginx proxies to websockify
    location / {
        # Check if this is a WebSocket upgrade request
        if ($http_upgrade) {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 3600s;
            proxy_buffering off;
            break;
        }
        
        # Otherwise serve static files
        try_files $uri $uri/ /vnc.html;
        
        # Set proper MIME types
        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/json json;
            image/png png;
            image/svg+xml svg;
            image/x-icon ico;
        }
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }
}
